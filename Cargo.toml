[package]
name = "muir"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Mete Balci"]
description = "A simulator of the MIT CADR Lisp Machine, at three fidelity levels down to its TTL parts."
repository = "https://github.com/metebalci/muir"
homepage = "https://muir.metebalci.com"
documentation = "https://muir.metebalci.com"
readme = "README.md"

[dependencies]

# The engines are the workload, so an unoptimised test run is dominated by
# them. At this level the whole suite runs in about a minute with the System
# 100 release in `vendor/`, the four-minute CC diagnostic being `#[ignore]`d.
[profile.test]
opt-level = 2

# The engines are one crate and `chip` is a gate loop calling part behaviours
# across its modules: one codegen unit and fat LTO let those inline, which
# `examples/benchmark.rs` measured at 3% on the netlist. Opt-level is 3 already.
# `-C target-cpu=native` measured nothing --- the target is `apple-m1` as it
# is, and what a newer core adds is vector instructions the loop cannot use.
#
# **`codegen-units` is 16 rather than 1, and that costs the 3%.** At 1 with
# opt-level 3, rustc 1.98.0 compiles `chaos::board::Turn::tc` so that it
# produces a byte its own arithmetic cannot reach: seventeen counts from
# zero, each able only to `wrapping_sub(1)`, leave the byte at 7, which is
# not zero less anything from 0 to 17. `a_batched_run_of_terminal_counts_is
# _a_stepped_one` is what catches it. Opt-level 2 is clean, 16 codegen units
# are clean, and fat LTO is not implicated --- it is the pair. The whole
# suite was run under the faulty pair first, so the extent is known: 695
# tests, that one the only failure. Issue 79, and the user's call, in their
# words: "naturally it has to run correct".
#
# **It is the compiler, and `rust-toolchain.toml` pins the one that has
# it.** Measured on this test at `codegen-units = 1`: 1.98.0 fails, 1.98.1
# fails, 1.99.0-beta.4 passes. Two nightlies of one channel put the change
# in a window --- `e71c0f1e3` of 18 August and `f7d782a3b` of 19 August both
# fail, `cea272fa3` of 7 September passes --- which a release comparison
# could not, since 1.98 against 1.99 cannot tell one LLVM patch from a
# release of other changes.
#
# `rust-lang/rust#162398` reports the same shape: the loop vectorizer
# producing `n % 4` for a negate-inside-reduction, on aarch64-apple,
# labelled `I-miscompile`. That is what `wrapping_sub(1)` accumulated
# across the caller's loop is, and it accounts for the one odd thing about
# this fault --- it needs `tc` inlined into that loop, which one codegen
# unit gives and sixteen do not, and which no separate crate can, so
# extracting it to reduce it was never going to reproduce it. The issue is
# closed as `not_planned` and what it turns on is in the comments rather
# than the body: an LLVM maintainer writes "I think this was fixed by
# llvm/llvm-project#210957 (which has since been backported)", hedged as
# quoted, and the reporter then confirms a newer nightly is correct. The
# nightly window above spans that backport, so the attribution fits;
# **it is still a window and not a bisection to a commit**, and the
# attribution upstream is its author's guess.
#
# **The 3% comes back with the pin, and the way back has been walked
# once.** When `rust-toolchain.toml` moves to 1.99 or later, put
# `codegen-units = 1` back and run `cargo test --release --no-fail-fast`
# --- `cargo test` stops at the first failing target, so without that flag
# the run answers a narrower question than it looks like it does. On
# 1.99.0-beta.4 with `codegen-units = 1` restored that is 76 targets, 697
# passed, 0 failed, 26 ignored. If it comes out that way again, this
# comment is spent.
[profile.release]
lto = "fat"
codegen-units = 16
